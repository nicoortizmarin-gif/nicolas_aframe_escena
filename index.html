<!-- ================================================= -->
<!--          ANIMACIÓN CONTINUA                       -->
<!-- ================================================= -->

<script>

const carro = document.querySelector('#carro');

let paso = 0;

function moverCarro() {

  if (paso === 0) {

    carro.setAttribute('animation__movimiento', {
      property: 'position',
      to: '8 0.55 6',
      dur: 5000,
      easing: 'linear'
    });

    carro.setAttribute('animation__giro', {
      property: 'rotation',
      to: '0 180 0',
      dur: 500
    });

    paso = 1;

  } else if (paso === 1) {

    carro.setAttribute('animation__movimiento', {
      property: 'position',
      to: '8 0.55 -6',
      dur: 5000,
      easing: 'linear'
    });

    carro.setAttribute('animation__giro', {
      property: 'rotation',
      to: '0 270 0',
      dur: 500
    });

    paso = 2;

  } else if (paso === 2) {

    carro.setAttribute('animation__movimiento', {
      property: 'position',
      to: '-8 0.55 -6',
      dur: 5000,
      easing: 'linear'
    });

    carro.setAttribute('animation__giro', {
      property: 'rotation',
      to: '0 360 0',
      dur: 500
    });

    paso = 3;

  } else {

    carro.setAttribute('animation__movimiento', {
      property: 'position',
      to: '-8 0.55 6',
      dur: 5000,
      easing: 'linear'
    });

    carro.setAttribute('animation__giro', {
      property: 'rotation',
      to: '0 90 0',
      dur: 500
    });

    paso = 0;
  }

  carro.addEventListener('animationcomplete__movimiento', moverCarro, {
    once: true
  });
}

moverCarro();

</script>
